<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URL Shortener API</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style type="text/tailwindcss">

        .main-container{
            @apply max-w-7xl mx-auto px-4;
        }

        .card{
            @apply bg-slate-800 rounded-xl p-6 shadow-lg border border-slate-700;
        }

        .button{
            @apply inline-flex items-center justify-center px-5 py-2.5 rounded-lg font-medium bg-blue-600 hover:bg-blue-700 text-white transition;
        }

        .heading-1{
            @apply text-4xl md:text-5xl font-bold text-white;
        }

        .heading-2{
            @apply text-2xl font-semibold text-white;
        }

        .text-muted{
            @apply text-slate-400;
        }

    </style>
</head>

<body class="bg-slate-900 text-white min-h-screen flex flex-col">

    <nav class="bg-slate-800 border-b border-slate-700">
        <div class="main-container">

            <div class="h-16 flex items-center">

                <a
                    href="/"
                    class="text-xl font-bold"
                >
                    URL Shortener
                </a>

            </div>

        </div>
    </nav>


    <main class="flex-grow flex items-center">

        <div class="main-container">

            <div class="max-w-2xl mx-auto text-center">

                <div class="card">

                    <h1 class="heading-1 my-4">
                        Welcome to URL Shortener
                    </h1>

                    <p class="text-muted text-lg mb-8">
                        This project is API-first. Visit the documentation
                        to explore the available endpoints and learn how
                        to use the API.
                    </p>

                    <a
                        href="/docs"
                        class="button"
                    >
                        View API Documentation
                    </a>

                </div>

            </div>

        </div>

    </main>


    <footer class="border-t border-slate-700 bg-slate-800 py-6">

        <div class="main-container text-center text-slate-400">

            © 2026 URL Shortener

        </div>

    </footer>

</body>
</html>
